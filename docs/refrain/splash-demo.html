#splash {
  --sp-bg: #F6F3EC;
  --sp-ink: #20242E;
  --sp-muted: #6C7080;
  --sp-accent: #3F51D8;
  position: absolute; inset: 0; z-index: 5;
  display: grid; place-items: center;
  background: var(--sp-bg); color: var(--sp-ink);
  pointer-events: none; user-select: none;
  animation: spOut 0.42s ease 1.5s forwards;
}
@media (prefers-color-scheme: dark) {
  #splash { --sp-bg: #15171E; --sp-ink: #EEF0F6; --sp-muted: #9096A8; --sp-accent: #6F7DF0; }
}

#splash .sp-stage { display: grid; justify-items: center; gap: 22px; transform: translateY(-2%); }

/* значок R и две волны-отголоска */
#splash .sp-mark { position: relative; width: 92px; height: 92px; }
#splash .sp-tile, #splash .sp-ring { position: absolute; inset: 0; border-radius: 28px; }
#splash .sp-tile {
  display: grid; place-items: center;
  background: var(--sp-accent); color: #fff;
  font: 600 58px/1 'Literata Splash', Georgia, 'Times New Roman', serif;
  box-shadow: 0 14px 34px color-mix(in srgb, var(--sp-accent) 38%, transparent);
  animation: spTile 0.62s cubic-bezier(0.2, 1.3, 0.4, 1) both;
}
#splash .sp-tile i { font-style: normal; transform: translateY(-2px); }
#splash .sp-ring { border: 2px solid var(--sp-accent); opacity: 0; animation: spRing 1.1s cubic-bezier(0.2, 0.6, 0.3, 1) both; }
#splash .sp-ring.r1 { animation-delay: 0.38s; }
#splash .sp-ring.r2 { animation-delay: 0.6s; }

/* слово: буквы поднимаются по очереди */
#splash .sp-word {
  display: flex; font: 600 46px/1.1 'Literata Splash', Georgia, 'Times New Roman', serif; letter-spacing: 0.01em;
}
#splash .sp-word span {
  position: relative; display: inline-block;
  animation: spLetter 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  animation-delay: calc(0.42s + var(--i) * 0.05s);
}
/* отголосок буквы: контур, который догоняет букву справа и тает */
#splash .sp-word span::after {
  content: attr(data-l); position: absolute; left: 0; top: 0;
  color: transparent; -webkit-text-stroke: 1.2px var(--sp-accent);
  opacity: 0; animation: spEcho 0.8s ease-out both;
  animation-delay: calc(0.55s + var(--i) * 0.05s);
}
#splash .sp-tag {
  font: 500 15px/1.3 Onest, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.06em; color: var(--sp-muted);
  animation: spTag 0.6s ease 0.95s both;
}

@keyframes spTile { from { transform: scale(0.55) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes spRing { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(2.1); opacity: 0; } }
@keyframes spLetter { from { transform: translateY(0.45em); opacity: 0; filter: blur(6px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes spEcho { 0% { transform: translateX(0.32em); opacity: 0.7; } 100% { transform: translateX(0); opacity: 0; } }
@keyframes spTag { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes spOut { to { opacity: 0; visibility: hidden; } }

/* Без анимации (системная настройка): просто показать название и плавно убрать. */
@media (prefers-reduced-motion: reduce) {
  #splash { animation-delay: 0.6s; }
  #splash .sp-tile, #splash .sp-word span, #splash .sp-tag { animation: none; }
  #splash .sp-ring, #splash .sp-word span::after { display: none; }
}

@media (max-width: 420px) {
  #splash .sp-word { font-size: 38px; }
  #splash .sp-mark { width: 80px; height: 80px; }
  #splash .sp-tile { font-size: 50px; border-radius: 24px; }
  #splash .sp-ring { border-radius: 24px; }
}

html,body{margin:0;height:100%;background:#F6F3EC;font-family:system-ui,sans-serif}
@media (prefers-color-scheme: dark){html,body{background:#15171E}}
#stage{position:relative;height:100vh;min-height:320px;overflow:hidden}
#replay{position:absolute;right:16px;bottom:16px;z-index:10;padding:8px 14px;border-radius:10px;border:1px solid #8884;background:#fff8;color:#333;font:500 14px system-ui;cursor:pointer}
</style>
<div id="stage"><div id="splash" aria-hidden="true">
    <div class="sp-stage">
      <div class="sp-mark"><span class="sp-ring r2"></span><span class="sp-ring r1"></span><div class="sp-tile"><i>R</i></div></div>
      <div class="sp-word"><span style="--i:0" data-l="R">R</span><span style="--i:1" data-l="e">e</span><span style="--i:2" data-l="f">f</span><span style="--i:3" data-l="r">r</span><span style="--i:4" data-l="a">a</span><span style="--i:5" data-l="i">i</span><span style="--i:6" data-l="n">n</span></div>
      <div class="sp-tag">Повтори — и запомни</div>
    </div>
  </div><button id="replay">Повторить</button></div>
<script>
const stage=document.getElementById('stage');
function play(){const old=document.getElementById('splash');const n=old.cloneNode(true);old.replaceWith(n);}
document.getElementById('replay').onclick=play;
setInterval(play,4200);
</script></html>
