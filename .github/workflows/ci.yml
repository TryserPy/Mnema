# Проверки на каждый пуш: типы, модульные тесты, сборка.
name: Проверка

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Типы
        run: npx tsc --noEmit
      - name: Модульные тесты
        run: npx vitest run
      - name: Сборка
        run: npx vite build
