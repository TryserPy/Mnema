# Сервер Refrain ИИ: проверки на каждый пуш, выкладка — только вручную (Actions → «Сервер Refrain ИИ» → Run workflow, deploy = true).
name: Сервер Refrain ИИ

on:
  push:
    branches: ['**']
    paths: ['server/**', 'shared/refrain/**', 'shared/prompts/**', 'shared/readable.mjs', 'shared/urlGuard.mjs', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'shared/refrain/**', 'shared/prompts/**', 'shared/readable.mjs', 'shared/urlGuard.mjs']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Выложить на Cloudflare (после зелёных проверок)'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Типы
        run: npx tsc --noEmit
      - name: Тесты (Workers, Miniflare)
        run: npx vitest run

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    # Окружение production в настройках репозитория можно закрыть ручным подтверждением.
    environment: production
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Миграции D1
        run: npx wrangler d1 migrations apply refrain --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Выкладка
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
