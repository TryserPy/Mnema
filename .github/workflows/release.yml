# Выпуск новой версии: по тегу vX.Y.Z собираются APK, установщик Windows и пакеты Linux (AppImage, .deb, .tar.gz; x64 и arm64)
# и выкладываются в GitHub Releases. Оттуда Refrain сам берёт обновления (Windows — electron-updater по latest.yml,
# Linux AppImage — по latest-linux.yml / latest-linux-arm64.yml, .deb и архив — уведомление со ссылкой, Android — APK из выпуска).
#
# Нужен один секрет репозитория: ANDROID_KEYSTORE_B64 — ключ подписи APK в base64
# (тот же ключ, которым подписаны прошлые версии, иначе обновление не встанет поверх).
# Необязательный: ANDROID_KEYSTORE_PASSWORD (если пароль ключа не стандартный).
name: Выпуск

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# По умолчанию — только чтение; писать в выпуски может лишь последний шаг.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: v
        name: Версия
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          grep -q "APP_VERSION = '$V'" src/update.ts || { echo "::error::В src/update.ts другая версия, чем в package.json ($V)"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не совпадает с версией v$V в package.json"; exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar" >> "$GITHUB_ENV"
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Нет секрета ANDROID_KEYSTORE_B64 (ключ подписи APK)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/mnema-release.jks
      - name: Сборка APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'mnema-release' }}
        run: bash android/build.sh
      - name: Имя файла
        run: |
          V=${{ needs.web.outputs.version }}
          mkdir -p out && cp "android/build/Refrain-$V.apk" "out/Refrain-$V-Android.apk"
          rm -f android/mnema-release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Установщик
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  linux:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Пакеты Linux
        # Имена: Refrain-<версия>-x86_64.AppImage, Refrain-<версия>-arm64.AppImage, Refrain_<версия>_amd64.deb,
        # Refrain_<версия>_arm64.deb, Refrain-<версия>-x64.tar.gz, Refrain-<версия>-arm64.tar.gz; latest-linux*.yml — для самообновления AppImage.
        run: npx electron-builder --linux AppImage deb tar.gz --x64 --arm64 --publish never
      - name: Проверка набора файлов
        run: |
          V=${{ needs.web.outputs.version }}
          ls -la release
          for f in "Refrain-$V-x86_64.AppImage" "Refrain-$V-arm64.AppImage" "Refrain_${V}_amd64.deb" "Refrain_${V}_arm64.deb" "Refrain-$V-x64.tar.gz" "Refrain-$V-arm64.tar.gz" latest-linux.yml latest-linux-arm64.yml; do
            [ -s "release/$f" ] || { echo "::error::Нет файла release/$f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/latest-linux*.yml

  release:
    needs: [web, android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          # Только файлы для установки (без веб-сборки dist).
          pattern: '{apk,windows,linux}'
          merge-multiple: true
      - name: Текст выпуска
        run: |
          V=${{ needs.web.outputs.version }}
          awk -v v="## $V" 'index($0, v)==1 {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Refrain $V" > notes.md
          ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.web.outputs.version }}
          # Запуск кнопкой (без метки): метка создаётся на собранном коммите.
          target_commitish: ${{ github.sha }}
          name: Refrain ${{ needs.web.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: files/*
